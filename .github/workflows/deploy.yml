name: Deploy to VPS via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: SSH_HOST
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Copy .htaccess into dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, bcmath, zip, gd, exif
          coverage: none
          tools: composer:v2

      - name: Install Laravel vendor (production)
        working-directory: backend
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Deploy to VPS via SSH (rsync with retry)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
          SSH_BACKEND_DIR: ${{ secrets.SSH_BACKEND_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Default SSH_PORT to 22 if secret is empty/unset
          : "${SSH_PORT:=22}"

          # Sanity checks (fail fast with a clear message)
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USERNAME" ] || [ -z "$SSH_TARGET_DIR" ]; then
            echo "Missing required secret: SSH_HOST / SSH_USERNAME / SSH_TARGET_DIR"
            exit 1
          fi
          if [ ! -s ~/.ssh/deploy_key ]; then
            echo "SSH_PRIVATE_KEY secret is empty"
            exit 1
          fi

          echo "Using host=$SSH_HOST port=$SSH_PORT user=$SSH_USERNAME"

          SSH_OPTS="-p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=2"

          # ---- Frontend (SPA dist) ----
          for attempt in 1 2 3; do
            echo "Frontend deploy attempt $attempt of 3"
            rsync -rltgoDzvO --delete --exclude='.well-known' \
              -e "ssh $SSH_OPTS" \
              dist/ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET_DIR" && break
            [ "$attempt" -lt 3 ] && { echo "Frontend SSH failed; retrying in 30s..."; sleep 30; } || {
              echo "Frontend deploy failed."; exit 1;
            }
          done

          # ---- Backend (Laravel) ----
          if [ -z "$SSH_BACKEND_DIR" ]; then
            echo "SSH_BACKEND_DIR not set — skipping backend deploy."
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "Backend deploy attempt $attempt of 3"
            rsync -rltgoDzvO --delete \
              --exclude='.env' \
              --exclude='storage/app/public/*' \
              --exclude='storage/app/private/*' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='.phpunit.cache' \
              --exclude='tests' \
              -e "ssh $SSH_OPTS" \
              backend/ "$SSH_USERNAME@$SSH_HOST:$SSH_BACKEND_DIR" && break
            [ "$attempt" -lt 3 ] && { echo "Backend SSH failed; retrying in 30s..."; sleep 30; } || {
              echo "Backend deploy failed."; exit 1;
            }
          done

          # ---- Post-deploy: migrate + cache warm ----
          ssh $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" bash -lc "'
            cd $SSH_BACKEND_DIR &&
            php artisan migrate --force &&
            php artisan storage:link 2>/dev/null || true &&
            php artisan optimize:clear &&
            php artisan config:cache &&
            php artisan route:cache &&
            php artisan event:cache &&
            (sudo systemctl reload php8.4-fpm 2>/dev/null || sudo systemctl reload php-fpm 2>/dev/null || true) &&
           (sudo systemctl reload nginx 2>/dev/null || true) &&
           (sudo supervisorctl restart primepos-reverb 2>/dev/null || true)
          '"