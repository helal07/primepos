name: Deploy to Hostinger via SSH

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: SSH_HOST
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build project
        run: npm run build

      - name: Copy .htaccess into dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: Deploy to Hostinger via SSH (rsync with retry)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt of 3"
            rsync -rltgoDzvO --delete --exclude='.well-known' \
              -e "ssh -p $SSH_PORT -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=2" \
              dist/ "$SSH_USERNAME@$SSH_HOST:$SSH_TARGET_DIR" && exit 0

            if [ "$attempt" -lt 3 ]; then
              echo "SSH connection failed; retrying in 30 seconds..."
              sleep 30
            fi
          done

          echo "Deployment failed because the SSH server did not respond. Check Hostinger SSH host, port, firewall, and server status."
          exit 1