; PHP-FPM pool sizing for a 6 vCPU / 8 GB VPS running nginx + PHP-FPM in one
; container with MySQL alongside. ~40 MB per worker → ~1 GB peak for PHP.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500

request_terminate_timeout = 120s
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
