user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    upstream php-fpm { server 127.0.0.1:9000; }

    server {
        listen 80 default_server;
        server_name _;

        # Laravel public root (API + storage symlink)
        root /var/www/html/public;
        index index.html index.php;

        # ---- Laravel-handled routes ----
        location ~ ^/(api|sanctum|up|storage|login|logout|webhook)(/|$) {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_read_timeout 120;
        }

        # ---- React SPA (Vite build copied into Laravel public/) ----
        location / {
            root /var/www/html/public;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
            root /var/www/html/public;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location ~ /\.(?!well-known) { deny all; }
    }
}